name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun --revision
      - name: Validate tag and version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH with optional prerelease" >&2
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${BASH_REMATCH[1]}" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "Release tag must be annotated" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag must point at a commit on main" >&2
            exit 1
          fi
      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.3.2
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run test:integration
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[/ { exit }
            found { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "No CHANGELOG entry for $VERSION" >&2
            exit 1
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: dist/**
